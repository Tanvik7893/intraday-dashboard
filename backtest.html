<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>intra. — Backtest</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f6f6f4;--card:#ffffff;--border:#e8e8e4;--border2:#d4d4ce;
  --txt:#111111;--txt2:#555550;--txt3:#999990;
  --green:#1a7a4a;--green-bg:#e8f5ee;--green-bd:#b8dfc9;
  --red:#c0392b;--red-bg:#fdf0ee;--red-bd:#f0b8b2;
  --amber:#9a5c00;--amber-bg:#fef3e2;--amber-bd:#f0cc88;
  --blue:#1e40af;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --nav-h:52px;--safe:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
/* TOPBAR */
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.logo{display:flex;align-items:baseline;gap:6px;}
.logo-name{font-size:16px;font-weight:700;letter-spacing:-0.3px;color:var(--txt);}
.logo-name span{color:var(--green);}
.logo-sub{font-size:11px;color:var(--txt3);}
.back-btn{font-size:11px;color:var(--green);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;text-decoration:none;}
.sec-label{font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--txt3);text-transform:uppercase;padding:14px 16px 6px;}
/* SUMMARY GRID */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 12px 0;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 10px;text-align:center;}
.sum-val{font-size:20px;font-weight:700;letter-spacing:-0.5px;line-height:1;}
.sum-lbl{font-size:9px;font-weight:600;color:var(--txt3);letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;}
.sum-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 12px 0;}
.mini-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center;}
.mini-val{font-size:16px;font-weight:700;line-height:1;}
.mini-lbl{font-size:9px;color:var(--txt3);letter-spacing:0.06em;text-transform:uppercase;margin-top:3px;}
/* SPARKLINE */
.spark-card{margin:8px 12px 0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.spark-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.spark-title{font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:0.06em;text-transform:uppercase;}
.spark-val{font-size:14px;font-weight:700;}
/* SCORE BANDS */
.band-card{margin:8px 12px 0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.band-row{margin-bottom:10px;}
.band-row:last-child{margin-bottom:0;}
.band-head{display:flex;justify-content:space-between;margin-bottom:4px;}
.band-lbl{font-size:11px;color:var(--txt2);font-weight:500;}
.band-stat{font-size:11px;font-weight:700;}
.band-track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.band-fill{height:100%;border-radius:3px;transition:width .5s;}
/* FILTERS */
.filter-row{margin:8px 12px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--txt3);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s;}
.filter-btn.active{border-color:var(--green-bd);background:var(--green-bg);color:var(--green);font-weight:600;}
.score-filter{display:flex;align-items:center;gap:6px;margin-left:auto;}
.score-filter span{font-size:11px;color:var(--txt3);}
.score-filter input{accent-color:var(--green);width:72px;}
.score-filter .val{font-size:11px;color:var(--txt);font-weight:600;min-width:20px;}
/* INSIGHT BOX */
.insight{margin:8px 12px 0;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:10px;padding:12px 14px;}
.insight-lbl{font-size:9px;font-weight:700;color:var(--green);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px;}
.insight-txt{font-size:12px;color:var(--txt2);line-height:1.6;}
/* SIGNAL TABLE */
.tbl-wrap{margin:8px 12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.tbl-head{display:grid;grid-template-columns:58px 80px 44px 68px 60px 72px 70px;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--border);}
.th{font-size:9px;font-weight:700;color:var(--txt3);letter-spacing:0.08em;text-transform:uppercase;}
.th.r{text-align:right;}
.tbl-row{display:grid;grid-template-columns:58px 80px 44px 68px 60px 72px 70px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;}
.tbl-row:last-child{border-bottom:none;}
.tbl-row:nth-child(even){background:#fafaf8;}
.td{font-size:11px;color:var(--txt2);}
.td.r{text-align:right;}
.td.bold{font-weight:600;color:var(--txt);}
.td.green{color:var(--green);font-weight:700;}
.td.red{color:var(--red);font-weight:700;}
.td.amber{color:var(--amber);font-weight:600;}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;display:inline-block;}
.b-hit{background:var(--green-bg);color:var(--green);}
.b-sl{background:var(--red-bg);color:var(--red);}
.b-part{background:var(--amber-bg);color:var(--amber);}
/* RISK NOTICE */
.risk-notice{margin:0 12px 8px;padding:9px 13px;background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:8px;font-size:11px;color:var(--blue);line-height:1.5;}
@media(min-width:768px){
  .sum-grid,.sum-grid-4,.spark-card,.band-card,.filter-row,.tbl-wrap,.insight,.risk-notice{margin-left:16px;margin-right:16px;}
  .tbl-head,.tbl-row{grid-template-columns:70px 90px 48px 76px 68px 80px 78px;}
}
</style>
</head>

</div>

// ── P&L CALC — ₹5,000 MAX RISK ────────────────────────────
function calcPnL(sig) {
  const slDist = Math.abs(sig.entry - sig.sl);
  if (!slDist) return 0;
  const qty = Math.max(1, Math.floor(5000 / slDist));
  const risk = qty * slDist; // actual risk ≤ 5000
  if (sig.res === "TARGET_HIT") return Math.round((sig.t1 - sig.entry) * qty);
  if (sig.res === "PARTIAL_WIN") return Math.round(((sig.t1 - sig.entry) / 2) * qty);
  if (sig.res === "SL_HIT") return -Math.round(risk);
  return 0;
}

function calcRisk(sig) {
  const slDist = Math.abs(sig.entry - sig.sl);
  if (!slDist) return 0;
  const qty = Math.max(1, Math.floor(5000 / slDist));
  return Math.min(5000, Math.round(qty * slDist));
}

// ── STATE ─────────────────────────────────────────────────
const ALL = genSignals();

let scoreMin = 0;

function filtered() {
  return ALL.filter(s => {
    if (filterStock !== "ALL" && s.s !== filterStock) return false;
    if (s.score < scoreMin) return false;
    return true;
  });
}

// ── RENDER ─────────────────────────────────────────────────

  const sigs = filtered();
  const wins = sigs.filter(s => s.res === "TARGET_HIT" || s.res === "PARTIAL_WIN").length;
  const sls  = sigs.filter(s => s.res === "SL_HIT").length;
  const wr   = sigs.length ? Math.round(wins / sigs.length * 100) : 0;
  const totalPnL = sigs.reduce((a, s) => a + calcPnL(s), 0);
  const avgScore = sigs.length ? Math.round(sigs.reduce((a,s)=>a+s.score,0)/sigs.length) : 0;

  const avgRisk  = sigs.length ? Math.round(sigs.reduce((a,s)=>a+calcRisk(s),0)/sigs.length) : 0;

    {l:"Win Rate", v: wr+"%", c: wr>=60?"var(--green)":wr>=50?"var(--amber)":"var(--red)"},

    {l:"Max Drawdown",v:"₹"+Math.abs(maxDD).toLocaleString("en-IN"),c:"var(--amber)"},
    {l:"Avg Risk/Trade",v:"₹"+avgRisk.toLocaleString("en-IN"),c:"var(--txt)"},
  ].map(c=>`<div class="mini-card"><div class="mini-val" style="color:${c.c}">${c.v}</div><div class="mini-lbl">${c.l}</div></div>`).join("");

  // Sparkline
  renderSparkline(sigs, totalPnL);

  // Score bands
  const bands = [{l:"80–100",min:80,max:100},{l:"70–79",min:70,max:79},{l:"60–69",min:60,max:69},{l:"Below 60",min:0,max:59}];
  document.getElementById("band-card").innerHTML = bands.map(b => {
    const bs = ALL.filter(s=>s.score>=b.min&&s.score<=b.max);
    const bw = bs.filter(s=>s.res==="TARGET_HIT"||s.res==="PARTIAL_WIN").length;
    const br = bs.length ? Math.round(bw/bs.length*100) : 0;
    const bc = br>=70?"var(--green)":br>=50?"var(--amber)":"var(--red)";
    return `<div class="band-row">
      <div class="band-head"><span class="band-lbl">Score ${b.l}</span><span class="band-stat" style="color:${bc}">${bs.length?br+"% ("+bw+"/"+bs.length+")":"no data"}</span></div>
      ${bs.length?`<div class="band-track"><div class="band-fill" style="width:${br}%;background:${bc}"></div></div>`:""}
    </div>`;
  }).join("");

  // Insight
  const best = bands.find(b=>ALL.filter(s=>s.score>=b.min&&s.score<=b.max).length>=3);
  const bullish = ALL.filter(s=>s.bias==="Bullish"&&(s.res==="TARGET_HIT"||s.res==="PARTIAL_WIN")).length;
  const bullTotal = ALL.filter(s=>s.bias==="Bullish").length;
  const bullWR = bullTotal ? Math.round(bullish/bullTotal*100) : 0;
  document.getElementById("insight-box").innerHTML = `
    <div class="insight-lbl">Key insight — ${ALL.length} signals, 30 days</div>
    <div class="insight-txt">
      Score 80+ signals win <strong>${bands[0] ? Math.round(ALL.filter(s=>s.score>=80&&(s.res==="TARGET_HIT"||s.res==="PARTIAL_WIN")).length / Math.max(1,ALL.filter(s=>s.score>=80).length)*100) : 0}%</strong> of the time.
      Bullish bias days: <strong>${bullWR}% win rate</strong>.
      ${wr >= 60 ? "System is performing well — stay disciplined." : wr >= 50 ? "Decent performance. Raise score filter to 75+ to improve." : "More data needed. Paper trade before going live."}
      Max risk per trade capped at ₹5,000.
    </div>`;

  // Table
  document.getElementById("tbl-body").innerHTML = [...sigs].reverse().map(s => {
    const pnl = calcPnL(s);
    const risk = calcRisk(s);
    const rc = s.res==="TARGET_HIT"?"b-hit":s.res==="PARTIAL_WIN"?"b-part":"b-sl";
    const rl = s.res==="TARGET_HIT"?"Target":s.res==="PARTIAL_WIN"?"Partial":"SL Hit";
    const sym = s.s==="BANKNIFTY"?"BN":s.s==="NIFTY50"?"NIFTY":s.s;
    return `<div class="tbl-row">
      <div class="td">${s.d.slice(5)}</div>
      <div class="td bold">${sym}</div>
      <div class="td" style="color:${s.score>=80?"var(--green)":s.score>=70?"var(--amber)":"var(--txt3)"};font-weight:600">${s.score}</div>
      <div class="td r">${s.entry.toLocaleString("en-IN")}</div>
      <div class="td r" style="color:var(--txt3)">₹${risk.toLocaleString("en-IN")}</div>
      <div class="td r ${pnl>0?"green":pnl<0?"red":""}">${pnl!==0?(pnl>0?"+":"")+"₹"+Math.abs(pnl).toLocaleString("en-IN"):"—"}</div>
      <div class="td r"><span class="badge ${rc}">${rl}</span></div>
    </div>`;
  }).join("");
}

function calcMaxDD(sigs) {
  let cum = 0, peak = 0, maxDD = 0;
  sigs.forEach(s => {
    cum += calcPnL(s);
    if (cum > peak) peak = cum;
    const dd = cum - peak;
    if (dd < maxDD) maxDD = dd;
  });
  return maxDD;
}

function renderSparkline(sigs, totalPnL) {
  let cum = 0;
  const pts = sigs.map(s => { cum += calcPnL(s); return cum; });
  if (!pts.length) return;
  const W = 360, H = 72;
  const minV = Math.min(...pts, 0), maxV = Math.max(...pts, 1);
  const range = maxV - minV || 1;
  const toX = (i) => (i / Math.max(pts.length - 1, 1)) * W;
  const toY = (v) => H - ((v - minV) / range) * (H - 8) - 4;
  const polyPts = pts.map((v, i) => `${toX(i)},${toY(v)}`).join(" ");
  const color = totalPnL >= 0 ? "var(--green)" : "var(--red)";
  const fillColor = totalPnL >= 0 ? "#1a7a4a22" : "#c0392b22";
  const closedPoly = `0,${H} ${polyPts} ${W},${H}`;
  document.getElementById("sparkline").innerHTML = `
    <polygon points="${closedPoly}" fill="${fillColor}"/>
    <polyline points="${polyPts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${toX(pts.length-1)}" cy="${toY(pts[pts.length-1])}" r="3" fill="${color}"/>
  `;
  document.getElementById("spark-total").innerHTML = `<span style="color:${color}">${totalPnL>=0?"+":""}₹${Math.abs(totalPnL).toLocaleString("en-IN")}</span>`;
  document.getElementById("spark-from").textContent = sigs[0] ? sigs[0].d.slice(5) : "";
  document.getElementById("spark-to").textContent = sigs[sigs.length-1] ? sigs[sigs.length-1].d.slice(5) : "";
}

// ── FILTERS ────────────────────────────────────────────────
function renderFilters() {
  const stocks = ["ALL","NIFTY50","BANKNIFTY","ICICIBANK","HDFCBANK","RELIANCE","SBIN","AXISBANK"];
  const row = document.getElementById("filter-row");
  row.innerHTML = stocks.map(s => `<button class="filter-btn${filterStock===s?" active":""}" onclick="setStock('${s}')">${s==="BANKNIFTY"?"BN":s==="NIFTY50"?"NIFTY":s}</button>`).join("") +
    `<div class="score-filter"><span>Score ≥</span><input type="range" min="0" max="80" step="10" value="${scoreMin}" oninput="setScore(this.value)"><span class="val" id="score-val">${scoreMin}</span></div>`;
}

function setStock(s) { filterStock = s; renderFilters(); render(); }
function setScore(v) { scoreMin = +v; document.getElementById("score-val").textContent = v; render(); }

renderFilters();
render();
</script>
